<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1010" viewBox="0 0 1280 1010" role="img" aria-label="为项目建立持续上下文"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#9daec3"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f6f8fb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="42" y="52" font-size="27" fill="#243047" font-weight="600">为项目建立持续上下文</text><text x="42" y="83" font-size="14" fill="#69758b" font-weight="400">带资料来源的项目形态 · E05 / E06；本地代码项目目录另由执行模块承接。</text><text x="46" y="127" font-size="13" fill="#34736b" font-weight="600">用户与界面主线</text><text x="770" y="127" font-size="13" fill="#34736b" font-weight="600">条件、分支与边界</text><rect x="45" y="151" width="640" height="112" rx="12" fill="#eaf0fa" stroke="#9fb4d1"/><text x="65" y="183" font-size="18" fill="#3d639c" font-weight="600">01  打开项目设置</text><text x="65" y="210" font-size="14" fill="#69758b" font-weight="400">创建或选定项目</text><text x="65" y="231" font-size="14" fill="#69758b" font-weight="400">编辑名称与自定义指令</text><path d="M365 263 L365 296" fill="none" stroke="#9daec3" stroke-width="1.5" marker-end="url(#arr)"/><rect x="45" y="302" width="640" height="112" rx="12" fill="#ffffff" stroke="#d8e0eb"/><text x="65" y="334" font-size="18" fill="#243047" font-weight="600">02  添加资料来源</text><text x="65" y="361" font-size="14" fill="#69758b" font-weight="400">文件、连接器来源或保存回复</text><text x="65" y="382" font-size="14" fill="#69758b" font-weight="400">按来源能力配置与授权</text><path d="M365 414 L365 447" fill="none" stroke="#9daec3" stroke-width="1.5" marker-end="url(#arr)"/><rect x="45" y="453" width="640" height="112" rx="12" fill="#ffffff" stroke="#d8e0eb"/><text x="65" y="485" font-size="18" fill="#243047" font-weight="600">03  检查资料状态</text><text x="65" y="512" font-size="14" fill="#69758b" font-weight="400">上传、同步、失败或不可编辑</text><text x="65" y="533" font-size="14" fill="#69758b" font-weight="400">在可用资料基础上继续</text><path d="M365 565 L365 598" fill="none" stroke="#9daec3" stroke-width="1.5" marker-end="url(#arr)"/><rect x="45" y="604" width="640" height="112" rx="12" fill="#ffffff" stroke="#d8e0eb"/><text x="65" y="636" font-size="18" fill="#243047" font-weight="600">04  在项目中开展对话</text><text x="65" y="663" font-size="14" fill="#69758b" font-weight="400">带项目背景提出任务</text><text x="65" y="684" font-size="14" fill="#69758b" font-weight="400">访问受项目与共享条件约束</text><path d="M365 716 L365 749" fill="none" stroke="#9daec3" stroke-width="1.5" marker-end="url(#arr)"/><rect x="45" y="755" width="640" height="112" rx="12" fill="#ffffff" stroke="#d8e0eb"/><text x="65" y="787" font-size="18" fill="#243047" font-weight="600">05  保存有用信息再复用</text><text x="65" y="814" font-size="14" fill="#69758b" font-weight="400">将可用回复纳入项目资料</text><text x="65" y="835" font-size="14" fill="#69758b" font-weight="400">供后续工作与回访使用</text><rect x="760" y="151" width="465" height="167" rx="12" fill="#ffffff" stroke="#d8e0eb"/><text x="780" y="183" font-size="18" fill="#243047" font-weight="600">资料限制</text><text x="780" y="210" font-size="14" fill="#69758b" font-weight="400">部分来源只能在 Web</text><text x="780" y="231" font-size="14" fill="#69758b" font-weight="400">端修改；有同步失败和未同步状态。</text><rect x="760" y="355" width="465" height="167" rx="12" fill="#ffffff" stroke="#d8e0eb"/><text x="780" y="387" font-size="18" fill="#243047" font-weight="600">访问条件</text><text x="780" y="414" font-size="14" fill="#69758b" font-weight="400">项目记忆范围存在不可修改条件；共享可能改变文件空间</text><text x="780" y="435" font-size="14" fill="#69758b" font-weight="400">访问。</text><rect x="760" y="559" width="465" height="167" rx="12" fill="#ffffff" stroke="#d8e0eb"/><text x="780" y="591" font-size="18" fill="#243047" font-weight="600">对象边界</text><text x="780" y="618" font-size="14" fill="#69758b" font-weight="400">本地项目根目录和资料项目不是一套可直接互换的配置。</text><text x="45" y="964" font-size="13" fill="#69758b" font-weight="400">流程由代码动作与相邻状态归纳；不表示所有账户、平台和版本默认开放，也不表示快照能独立运行。</text></g></svg>