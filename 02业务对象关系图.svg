<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920" role="img" aria-label="CX 业务对象关系图"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#9daec3"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f6f8fb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="42" y="52" font-size="27" fill="#243047" font-weight="600">CX 业务对象关系图</text><text x="42" y="83" font-size="14" fill="#69758b" font-weight="400">表达界面和调用中的关联；不是数据库表关系，也不声明对象基数。</text><rect x="40" y="130" width="340" height="110" rx="12" fill="#ffffff" stroke="#d8e0eb"/><text x="60" y="162" font-size="18" fill="#243047" font-weight="600">项目与资料</text><text x="60" y="189" font-size="14" fill="#69758b" font-weight="400">资料来源、指令、记忆或目录</text><text x="60" y="210" font-size="14" fill="#69758b" font-weight="400">为会话提供上下文</text><rect x="470" y="130" width="340" height="110" rx="12" fill="#ffffff" stroke="#d8e0eb"/><text x="490" y="162" font-size="18" fill="#243047" font-weight="600">主机与工作目录</text><text x="490" y="189" font-size="14" fill="#69758b" font-weight="400">本地 / 远端 / Worktree</text><text x="490" y="210" font-size="14" fill="#69758b" font-weight="400">指定任务在哪里工作</text><rect x="900" y="130" width="340" height="110" rx="12" fill="#ffffff" stroke="#d8e0eb"/><text x="920" y="162" font-size="18" fill="#243047" font-weight="600">模型、插件与技能</text><text x="920" y="189" font-size="14" fill="#69758b" font-weight="400">生成响应、调用工具、复用流程</text><text x="920" y="210" font-size="14" fill="#69758b" font-weight="400">受账号、能力与权限条件控制</text><path d="M210 240 L510 310" fill="none" stroke="#9daec3" stroke-width="1.5" marker-end="url(#arr)"/><path d="M640 240 L640 310" fill="none" stroke="#9daec3" stroke-width="1.5" marker-end="url(#arr)"/><path d="M1070 240 L770 310" fill="none" stroke="#9daec3" stroke-width="1.5" marker-end="url(#arr)"/><rect x="430" y="318" width="420" height="125" rx="12" fill="#eaf0fa" stroke="#9fb4d1"/><text x="450" y="350" font-size="18" fill="#3d639c" font-weight="600">会话 Thread → 轮次 Turn</text><text x="450" y="377" font-size="14" fill="#69758b" font-weight="400">输入与上下文组成一次提交</text><text x="450" y="398" font-size="14" fill="#69758b" font-weight="400">消息 / 工具内容项 / 执行状态</text><text x="450" y="419" font-size="14" fill="#69758b" font-weight="400">事件将结果反馈到会话</text><path d="M500 443 L220 520" fill="none" stroke="#9daec3" stroke-width="1.5" marker-end="url(#arr)"/><path d="M640 443 L640 520" fill="none" stroke="#9daec3" stroke-width="1.5" marker-end="url(#arr)"/><path d="M780 443 L1065 520" fill="none" stroke="#9daec3" stroke-width="1.5" marker-end="url(#arr)"/><rect x="40" y="535" width="340" height="116" rx="12" fill="#ffffff" stroke="#d8e0eb"/><text x="60" y="567" font-size="18" fill="#243047" font-weight="600">消息与过程</text><text x="60" y="594" font-size="14" fill="#69758b" font-weight="400">流式文字、状态与工具结果</text><text x="60" y="615" font-size="14" fill="#69758b" font-weight="400">终端、子任务及过程面板</text><rect x="470" y="535" width="340" height="116" rx="12" fill="#ffffff" stroke="#d8e0eb"/><text x="490" y="567" font-size="18" fill="#243047" font-weight="600">文件与内容产物</text><text x="490" y="594" font-size="14" fill="#69758b" font-weight="400">结果打开预览或编辑工作面</text><text x="490" y="615" font-size="14" fill="#69758b" font-weight="400">修改意图可以回到来源会话</text><rect x="900" y="535" width="340" height="116" rx="12" fill="#ffffff" stroke="#d8e0eb"/><text x="920" y="567" font-size="18" fill="#243047" font-weight="600">定时任务与运行</text><text x="920" y="594" font-size="14" fill="#69758b" font-weight="400">计划触发执行、产生运行记录</text><text x="920" y="615" font-size="14" fill="#69758b" font-weight="400">用户从运行记录打开聊天</text><path d="M640 651 L640 710" fill="none" stroke="#9daec3" stroke-width="1.5" marker-end="url(#arr)"/><rect x="290" y="730" width="700" height="105" rx="12" fill="#ffffff" stroke="#d8e0eb"/><text x="310" y="762" font-size="18" fill="#243047" font-weight="600">组织、回访与持续使用</text><text x="310" y="789" font-size="14" fill="#69758b" font-weight="400">Space / Library 组织内容；项目组织工作上下文</text><text x="310" y="810" font-size="14" fill="#69758b" font-weight="400">账号、团队、访问策略与宿主条件横跨上述对象</text><text x="42" y="882" font-size="14" fill="#69758b" font-weight="400">注意：Project、Space、文件系统目录与 Git Worktree 的含义不同，不能按中文“空间”一概合并。</text></g></svg>