name: Publish product documentation

on:
  push:
    branches: [main]
    paths:
      - '产品全貌.md'
      - '功能目录.csv'
      - '**/*.svg'
      - 'build_site.py'
      - 'test_build_site.py'
      - 'site_template.html'
      - 'requirements.txt'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-documentation-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Markdown renderer
        run: python3 -m pip install -r requirements.txt
      - name: Verify document generation
        run: python3 -m unittest -v test_build_site.py
      - name: Generate website from Markdown and CSV
        run: python3 build_site.py
      - name: Upload generated website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
