<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1010" viewBox="0 0 1280 1010" role="img" aria-label="查看产物并请求修改"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#9daec3"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f6f8fb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="42" y="52" font-size="27" fill="#243047" font-weight="600">查看产物并请求修改</text><text x="42" y="83" font-size="14" fill="#69758b" font-weight="400">产物与文件预览、编辑、同步状态 · E13 / E14 / E15</text><text x="46" y="127" font-size="13" fill="#34736b" font-weight="600">用户与界面主线</text><text x="770" y="127" font-size="13" fill="#34736b" font-weight="600">条件、分支与边界</text><rect x="45" y="151" width="640" height="112" rx="12" fill="#eaf0fa" stroke="#9fb4d1"/><text x="65" y="183" font-size="18" fill="#3d639c" font-weight="600">01  从会话打开结果</text><text x="65" y="210" font-size="14" fill="#69758b" font-weight="400">选择文件或内容产物</text><text x="65" y="231" font-size="14" fill="#69758b" font-weight="400">进入对应标签与预览面板</text><path d="M365 263 L365 296" fill="none" stroke="#9daec3" stroke-width="1.5" marker-end="url(#arr)"/><rect x="45" y="302" width="640" height="112" rx="12" fill="#ffffff" stroke="#d8e0eb"/><text x="65" y="334" font-size="18" fill="#243047" font-weight="600">02  检查展示与支持能力</text><text x="65" y="361" font-size="14" fill="#69758b" font-weight="400">按类型选择预览或编辑</text><text x="65" y="382" font-size="14" fill="#69758b" font-weight="400">实时会话能力取决于宿主</text><path d="M365 414 L365 447" fill="none" stroke="#9daec3" stroke-width="1.5" marker-end="url(#arr)"/><rect x="45" y="453" width="640" height="112" rx="12" fill="#ffffff" stroke="#d8e0eb"/><text x="65" y="485" font-size="18" fill="#243047" font-weight="600">03  编辑内容或提出修改</text><text x="65" y="512" font-size="14" fill="#69758b" font-weight="400">直接编辑支持的内容</text><text x="65" y="533" font-size="14" fill="#69758b" font-weight="400">也可批注并请求会话修改</text><path d="M365 565 L365 598" fill="none" stroke="#9daec3" stroke-width="1.5" marker-end="url(#arr)"/><rect x="45" y="604" width="640" height="112" rx="12" fill="#ffffff" stroke="#d8e0eb"/><text x="65" y="636" font-size="18" fill="#243047" font-weight="600">04  回到会话处理</text><text x="65" y="663" font-size="14" fill="#69758b" font-weight="400">把修改意图关联到来源工作</text><text x="65" y="684" font-size="14" fill="#69758b" font-weight="400">等待新一轮结果或更新</text><path d="M365 716 L365 749" fill="none" stroke="#9daec3" stroke-width="1.5" marker-end="url(#arr)"/><rect x="45" y="755" width="640" height="112" rx="12" fill="#ffffff" stroke="#d8e0eb"/><text x="65" y="787" font-size="18" fill="#243047" font-weight="600">05  确认保存与同步</text><text x="65" y="814" font-size="14" fill="#69758b" font-weight="400">检查保存、同步与打开状态</text><text x="65" y="835" font-size="14" fill="#69758b" font-weight="400">确认后继续使用或关闭</text><rect x="760" y="151" width="465" height="167" rx="12" fill="#ffffff" stroke="#d8e0eb"/><text x="780" y="183" font-size="18" fill="#243047" font-weight="600">宿主限制</text><text x="780" y="210" font-size="14" fill="#69758b" font-weight="400">存在“当前宿主不支持实时 Artifact</text><text x="780" y="231" font-size="14" fill="#69758b" font-weight="400">Session”的分支。</text><rect x="760" y="355" width="465" height="167" rx="12" fill="#ffffff" stroke="#d8e0eb"/><text x="780" y="387" font-size="18" fill="#243047" font-weight="600">保存失败</text><text x="780" y="414" font-size="14" fill="#69758b" font-weight="400">文件可打开，不代表编辑已写入 XLSX</text><text x="780" y="435" font-size="14" fill="#69758b" font-weight="400">或同步到实时会话。</text><rect x="760" y="559" width="465" height="167" rx="12" fill="#ffffff" stroke="#d8e0eb"/><text x="780" y="591" font-size="18" fill="#243047" font-weight="600">关闭分支</text><text x="780" y="618" font-size="14" fill="#69758b" font-weight="400">有未保存内容时可保持打开或确认关闭；修改请求失败可</text><text x="780" y="639" font-size="14" fill="#69758b" font-weight="400">保留草稿。</text><text x="45" y="964" font-size="13" fill="#69758b" font-weight="400">流程由代码动作与相邻状态归纳；不表示所有账户、平台和版本默认开放，也不表示快照能独立运行。</text></g></svg>