<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1010" viewBox="0 0 1280 1010" role="img" aria-label="创建并回访定时任务"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#9daec3"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f6f8fb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="42" y="52" font-size="27" fill="#243047" font-weight="600">创建并回访定时任务</text><text x="42" y="83" font-size="14" fill="#69758b" font-weight="400">任务创建、计划、归属和历次运行 · E12</text><text x="46" y="127" font-size="13" fill="#34736b" font-weight="600">用户与界面主线</text><text x="770" y="127" font-size="13" fill="#34736b" font-weight="600">条件、分支与边界</text><rect x="45" y="151" width="640" height="112" rx="12" fill="#eaf0fa" stroke="#9fb4d1"/><text x="65" y="183" font-size="18" fill="#3d639c" font-weight="600">01  开始创建任务</text><text x="65" y="210" font-size="14" fill="#69758b" font-weight="400">手工设置或通过会话引导</text><text x="65" y="231" font-size="14" fill="#69758b" font-weight="400">明确要重复执行的工作</text><path d="M365 263 L365 296" fill="none" stroke="#9daec3" stroke-width="1.5" marker-end="url(#arr)"/><rect x="45" y="302" width="640" height="112" rx="12" fill="#ffffff" stroke="#d8e0eb"/><text x="65" y="334" font-size="18" fill="#243047" font-weight="600">02  配置任务定义</text><text x="65" y="361" font-size="14" fill="#69758b" font-weight="400">标题、提示词、时间与频率</text><text x="65" y="382" font-size="14" fill="#69758b" font-weight="400">按条件选择个人或团队归属</text><path d="M365 414 L365 447" fill="none" stroke="#9daec3" stroke-width="1.5" marker-end="url(#arr)"/><rect x="45" y="453" width="640" height="112" rx="12" fill="#ffffff" stroke="#d8e0eb"/><text x="65" y="485" font-size="18" fill="#243047" font-weight="600">03  保存并检查状态</text><text x="65" y="512" font-size="14" fill="#69758b" font-weight="400">保存定义，检查启用和同步</text><text x="65" y="533" font-size="14" fill="#69758b" font-weight="400">确认来源插件仍可用</text><path d="M365 565 L365 598" fill="none" stroke="#9daec3" stroke-width="1.5" marker-end="url(#arr)"/><rect x="45" y="604" width="640" height="112" rx="12" fill="#ffffff" stroke="#d8e0eb"/><text x="65" y="636" font-size="18" fill="#243047" font-weight="600">04  由运行服务触发</text><text x="65" y="663" font-size="14" fill="#69758b" font-weight="400">到达计划时间执行任务</text><text x="65" y="684" font-size="14" fill="#69758b" font-weight="400">生成可回访的运行记录</text><path d="M365 716 L365 749" fill="none" stroke="#9daec3" stroke-width="1.5" marker-end="url(#arr)"/><rect x="45" y="755" width="640" height="112" rx="12" fill="#ffffff" stroke="#d8e0eb"/><text x="65" y="787" font-size="18" fill="#243047" font-weight="600">05  查看结果并继续处理</text><text x="65" y="814" font-size="14" fill="#69758b" font-weight="400">从运行记录 Open chat</text><text x="65" y="835" font-size="14" fill="#69758b" font-weight="400">查看结果、调整计划或暂停</text><rect x="760" y="151" width="465" height="167" rx="12" fill="#ffffff" stroke="#d8e0eb"/><text x="780" y="183" font-size="18" fill="#243047" font-weight="600">两种成功状态</text><text x="780" y="210" font-size="14" fill="#69758b" font-weight="400">保存任务成功与启动设置消息成功是两件事；后者可独立</text><text x="780" y="231" font-size="14" fill="#69758b" font-weight="400">失败。</text><rect x="760" y="355" width="465" height="167" rx="12" fill="#ffffff" stroke="#d8e0eb"/><text x="780" y="387" font-size="18" fill="#243047" font-weight="600">能力依赖</text><text x="780" y="414" font-size="14" fill="#69758b" font-weight="400">来源插件禁用、卸载或不可用可能影响任务运行。</text><rect x="760" y="559" width="465" height="167" rx="12" fill="#ffffff" stroke="#d8e0eb"/><text x="780" y="591" font-size="18" fill="#243047" font-weight="600">运行边界</text><text x="780" y="618" font-size="14" fill="#69758b" font-weight="400">调度行为依赖后台服务；当前快照不构成调度可靠性实测</text><text x="780" y="639" font-size="14" fill="#69758b" font-weight="400">。</text><text x="45" y="964" font-size="13" fill="#69758b" font-weight="400">流程由代码动作与相邻状态归纳；不表示所有账户、平台和版本默认开放，也不表示快照能独立运行。</text></g></svg>