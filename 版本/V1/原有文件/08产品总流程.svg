<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="产品总流程与模块连接"><defs><marker id="flow-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#879bb5"/></marker></defs><rect width="1280" height="640" rx="18" fill="#f6f8fb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="36" y="46" font-size="26" fill="#243047">产品总流程 · 从任务入口到结果回访</text><text x="36" y="76" font-size="15" fill="#243047">模块连接归纳与演示编排建议；可选分支不表示每次任务都需经过。</text><rect x="36" y="138" width="280" height="82" rx="12" fill="white" stroke="#b9c9dc"/><text x="51" y="168" font-size="18" fill="#243047">进入工作台</text><text x="51" y="196" font-size="14" fill="#243047">O01 · 按条件登录／引导</text><rect x="344" y="138" width="280" height="82" rx="12" fill="white" stroke="#b9c9dc"/><text x="359" y="168" font-size="18" fill="#243047">准备任务上下文</text><text x="359" y="196" font-size="14" fill="#243047">P、C03–C04 · 按需选择</text><rect x="652" y="138" width="280" height="82" rx="12" fill="white" stroke="#b9c9dc"/><text x="667" y="168" font-size="18" fill="#243047">输入与跟进执行</text><text x="667" y="196" font-size="14" fill="#243047">C01、C05–C08 · 消息过程</text><rect x="960" y="138" width="280" height="82" rx="12" fill="white" stroke="#b9c9dc"/><text x="975" y="168" font-size="18" fill="#243047">检查结果并修改</text><text x="975" y="196" font-size="14" fill="#243047">A01–A04、X06 · 按结果进入</text><path d="M316 179 L340 179" stroke="#879bb5" stroke-width="2" fill="none" marker-end="url(#flow-arrow)"/><path d="M624 179 L648 179" stroke="#879bb5" stroke-width="2" fill="none" marker-end="url(#flow-arrow)"/><path d="M932 179 L956 179" stroke="#879bb5" stroke-width="2" fill="none" marker-end="url(#flow-arrow)"/><rect x="36" y="338" width="280" height="82" rx="12" fill="white" stroke="#b9c9dc"/><text x="51" y="368" font-size="18" fill="#243047">扩展工具与技能</text><text x="51" y="396" font-size="14" fill="#243047">T01–T04 · 配置后返回任务</text><rect x="344" y="338" width="280" height="82" rx="12" fill="white" stroke="#b9c9dc"/><text x="359" y="368" font-size="18" fill="#243047">代码与网页执行分支</text><text x="359" y="396" font-size="14" fill="#243047">X01–X05、B01–B03</text><rect x="652" y="338" width="280" height="82" rx="12" fill="white" stroke="#b9c9dc"/><text x="667" y="368" font-size="18" fill="#243047">最近会话与内容回访</text><text x="667" y="396" font-size="14" fill="#243047">C02、A05–A06 · 找回结果</text><rect x="960" y="338" width="280" height="82" rx="12" fill="white" stroke="#b9c9dc"/><text x="975" y="368" font-size="18" fill="#243047">计划后续工作</text><text x="975" y="396" font-size="14" fill="#243047">S01–S03 · 记录 → 会话</text><path d="M176 338 L460 220" stroke="#879bb5" stroke-width="2" fill="none" marker-end="url(#flow-arrow)"/><path d="M484 338 L770 220" stroke="#879bb5" stroke-width="2" fill="none" marker-end="url(#flow-arrow)"/><path d="M1100 220 L792 338" stroke="#879bb5" stroke-width="2" fill="none" marker-end="url(#flow-arrow)"/><path d="M960 379 L932 379" stroke="#879bb5" stroke-width="2" fill="none" marker-end="url(#flow-arrow)"/><path d="M932 379 L944 379 L944 240 L792 240 L792 220" stroke="#879bb5" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#flow-arrow)"/><text x="810" y="460" font-size="14" fill="#243047">继续追问／回到来源会话</text><rect x="36" y="518" width="1204" height="72" rx="12" fill="#eaf0fa"/><text x="54" y="547" font-size="17" fill="#243047">横跨各流程：G01–G02 设置与桌面支撑；O02 协作与访问范围</text><text x="54" y="574" font-size="14" fill="#243047">原型验收：能进入、能返回、状态可辨；模拟交互不等于真实执行，链接不等于已验证。</text></g></svg>