<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="990" viewBox="0 0 1280 990" role="img" aria-label="CX 产品结构图"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#9daec3"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f6f8fb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="42" y="52" font-size="27" fill="#243047" font-weight="600">CX 产品结构图</text><text x="42" y="83" font-size="14" fill="#69758b" font-weight="400">按用户任务归并的产品结构；模块分组为分析分类，具体功能见代码证据编号。</text><rect x="420" y="125" width="440" height="111" rx="12" fill="#eaf0fa" stroke="#9fb4d1"/><text x="440" y="157" font-size="18" fill="#3d639c" font-weight="600">会话工作台 · C01—C08</text><text x="440" y="184" font-size="14" fill="#69758b" font-weight="400">需求输入 → 执行轮次 → 消息与状态</text><text x="440" y="205" font-size="14" fill="#69758b" font-weight="400">多标签、右侧面板、底部面板 · E02—E04</text><path d="M640 236 L640 280" fill="none" stroke="#9daec3" stroke-width="1.5" marker-end="url(#arr)"/><text x="42" y="292" font-size="14" fill="#34736b" font-weight="600">为任务提供上下文、执行位置和能力</text><rect x="40" y="314" width="270" height="116" rx="12" fill="#ffffff" stroke="#d8e0eb"/><text x="60" y="346" font-size="18" fill="#243047" font-weight="600">项目与上下文 · P</text><text x="60" y="373" font-size="14" fill="#69758b" font-weight="400">项目资料、指令、记忆</text><text x="60" y="394" font-size="14" fill="#69758b" font-weight="400">本地项目根目录 · E05—E06</text><rect x="350" y="314" width="270" height="116" rx="12" fill="#ffffff" stroke="#d8e0eb"/><text x="370" y="346" font-size="18" fill="#243047" font-weight="600">执行环境与代码 · X</text><text x="370" y="373" font-size="14" fill="#69758b" font-weight="400">主机、目录、终端、差异</text><text x="370" y="394" font-size="14" fill="#69758b" font-weight="400">Git / Worktree / 交接 · E03 /</text><text x="370" y="415" font-size="14" fill="#69758b" font-weight="400"> E07—E08</text><rect x="660" y="314" width="270" height="116" rx="12" fill="#ffffff" stroke="#d8e0eb"/><text x="680" y="346" font-size="18" fill="#243047" font-weight="600">插件与技能 · T</text><text x="680" y="373" font-size="14" fill="#69758b" font-weight="400">服务连接、工具、技能</text><text x="680" y="394" font-size="14" fill="#69758b" font-weight="400">插件与 MCP 设置 · E09—E11</text><rect x="970" y="314" width="270" height="116" rx="12" fill="#ffffff" stroke="#d8e0eb"/><text x="990" y="346" font-size="18" fill="#243047" font-weight="600">浏览器与电脑 · B</text><text x="990" y="373" font-size="14" fill="#69758b" font-weight="400">网页标签、历史、本机应用</text><text x="990" y="394" font-size="14" fill="#69758b" font-weight="400">应用使用审批 · E16—E18</text><path d="M640 430 L640 481" fill="none" stroke="#9daec3" stroke-width="1.5" marker-end="url(#arr)"/><text x="42" y="488" font-size="14" fill="#34736b" font-weight="600">让结果可检查、可修改，并持续开展工作</text><rect x="180" y="510" width="440" height="116" rx="12" fill="#ffffff" stroke="#d8e0eb"/><text x="200" y="542" font-size="18" fill="#243047" font-weight="600">文件空间与内容产物 · A</text><text x="200" y="569" font-size="14" fill="#69758b" font-weight="400">文件库、Space、产物预览与修改</text><text x="200" y="590" font-size="14" fill="#69758b" font-weight="400">文档 / 表格 / 演示 / 站点入口 · E13—E15 / E20 / E22</text><rect x="660" y="510" width="440" height="116" rx="12" fill="#ffffff" stroke="#d8e0eb"/><text x="680" y="542" font-size="18" fill="#243047" font-weight="600">定时任务与持续工作 · S</text><text x="680" y="569" font-size="14" fill="#69758b" font-weight="400">任务定义、时间计划、个人与团队归属</text><text x="680" y="590" font-size="14" fill="#69758b" font-weight="400">运行记录 → 打开执行会话 · E12</text><path d="M400 626 L400 675" fill="none" stroke="#9daec3" stroke-width="1.5" marker-end="url(#arr)"/><path d="M880 626 L880 675" fill="none" stroke="#9daec3" stroke-width="1.5" marker-end="url(#arr)"/><rect x="180" y="695" width="440" height="112" rx="12" fill="#ffffff" stroke="#d8e0eb"/><text x="200" y="727" font-size="18" fill="#243047" font-weight="600">账号与协作 · O</text><text x="200" y="754" font-size="14" fill="#69758b" font-weight="400">登录、引导、工作区、成员与共享范围</text><text x="200" y="775" font-size="14" fill="#69758b" font-weight="400">决定可使用的身份与内容上下文 · E02 / E20 / E23</text><rect x="660" y="695" width="440" height="112" rx="12" fill="#ffffff" stroke="#d8e0eb"/><text x="680" y="727" font-size="18" fill="#243047" font-weight="600">设置与桌面能力 · G</text><text x="680" y="754" font-size="14" fill="#69758b" font-weight="400">偏好、快捷键、用量、MCP 与系统桥接</text><text x="680" y="775" font-size="14" fill="#69758b" font-weight="400">向所有工作模块提供配置和宿主能力 · E02 / E24</text><text x="42" y="866" font-size="15" fill="#3d639c" font-weight="600">核心闭环</text><text x="42" y="897" font-size="18" fill="#243047" font-weight="400">项目背景 → 会话需求 → 工具执行 → 文件与产物 → 检查修改 → 回访或计划下一次执行</text><text x="42" y="941" font-size="13" fill="#69758b" font-weight="400">构建包另含购物、会议、安全等延伸入口；默认开放与完整链路未逐项核实。</text></g></svg>