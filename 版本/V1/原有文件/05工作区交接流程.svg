<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1010" viewBox="0 0 1280 1010" role="img" aria-label="将代码会话交接到 Worktree"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#9daec3"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f6f8fb"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="42" y="52" font-size="27" fill="#243047" font-weight="600">将代码会话交接到 Worktree</text><text x="42" y="83" font-size="14" fill="#69758b" font-weight="400">工作区和 Git 交接界面 · E07 / E08</text><text x="46" y="127" font-size="13" fill="#34736b" font-weight="600">用户与界面主线</text><text x="770" y="127" font-size="13" fill="#34736b" font-weight="600">条件、分支与边界</text><rect x="45" y="151" width="640" height="112" rx="12" fill="#eaf0fa" stroke="#9fb4d1"/><text x="65" y="183" font-size="18" fill="#3d639c" font-weight="600">01  从会话发起交接</text><text x="65" y="210" font-size="14" fill="#69758b" font-weight="400">打开 Hand off</text><text x="65" y="231" font-size="14" fill="#69758b" font-weight="400">选择本地或远端工作区目标</text><path d="M365 263 L365 296" fill="none" stroke="#9daec3" stroke-width="1.5" marker-end="url(#arr)"/><rect x="45" y="302" width="640" height="112" rx="12" fill="#ffffff" stroke="#d8e0eb"/><text x="65" y="334" font-size="18" fill="#243047" font-weight="600">02  选择目录与分支方案</text><text x="65" y="361" font-size="14" fill="#69758b" font-weight="400">已有 / 新建 Worktree</text><text x="65" y="382" font-size="14" fill="#69758b" font-weight="400">继续当前分支或切换分支</text><path d="M365 414 L365 447" fill="none" stroke="#9daec3" stroke-width="1.5" marker-end="url(#arr)"/><rect x="45" y="453" width="640" height="112" rx="12" fill="#ffffff" stroke="#d8e0eb"/><text x="65" y="485" font-size="18" fill="#243047" font-weight="600">03  执行前检查</text><text x="65" y="512" font-size="14" fill="#69758b" font-weight="400">检查分支名、分支占用与工作区</text><text x="65" y="533" font-size="14" fill="#69758b" font-weight="400">确认是否需要中断当前响应</text><path d="M365 565 L365 598" fill="none" stroke="#9daec3" stroke-width="1.5" marker-end="url(#arr)"/><rect x="45" y="604" width="640" height="112" rx="12" fill="#ffffff" stroke="#d8e0eb"/><text x="65" y="636" font-size="18" fill="#243047" font-weight="600">04  执行交接</text><text x="65" y="663" font-size="14" fill="#69758b" font-weight="400">通过检查后将会话接入目标环境</text><text x="65" y="684" font-size="14" fill="#69758b" font-weight="400">等待切换或创建完成</text><path d="M365 716 L365 749" fill="none" stroke="#9daec3" stroke-width="1.5" marker-end="url(#arr)"/><rect x="45" y="755" width="640" height="112" rx="12" fill="#ffffff" stroke="#d8e0eb"/><text x="65" y="787" font-size="18" fill="#243047" font-weight="600">05  继续工作或带回改动</text><text x="65" y="814" font-size="14" fill="#69758b" font-weight="400">在选定工作区执行后续任务</text><text x="65" y="835" font-size="14" fill="#69758b" font-weight="400">按条件 Bring changes back</text><rect x="760" y="151" width="465" height="167" rx="12" fill="#ffffff" stroke="#d8e0eb"/><text x="780" y="183" font-size="18" fill="#243047" font-weight="600">阻断条件</text><text x="780" y="210" font-size="14" fill="#69758b" font-weight="400">分支无效或已被占用时不能继续；未提交改动可能需先暂</text><text x="780" y="231" font-size="14" fill="#69758b" font-weight="400">存或提交。</text><rect x="760" y="355" width="465" height="167" rx="12" fill="#ffffff" stroke="#d8e0eb"/><text x="780" y="387" font-size="18" fill="#243047" font-weight="600">运行中会话</text><text x="780" y="414" font-size="14" fill="#69758b" font-weight="400">构建包含中断当前响应的警告，并存在等待响应结束的限</text><text x="780" y="435" font-size="14" fill="#69758b" font-weight="400">制分支。</text><rect x="760" y="559" width="465" height="167" rx="12" fill="#ffffff" stroke="#d8e0eb"/><text x="780" y="591" font-size="18" fill="#243047" font-weight="600">流程分支</text><text x="780" y="618" font-size="14" fill="#69758b" font-weight="400">交接不一定新建</text><text x="780" y="639" font-size="14" fill="#69758b" font-weight="400">Worktree，也不代表一定执行代码合并。</text><text x="45" y="964" font-size="13" fill="#69758b" font-weight="400">流程由代码动作与相邻状态归纳；不表示所有账户、平台和版本默认开放，也不表示快照能独立运行。</text></g></svg>